name: Checkout regression gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: checkout_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: checkout_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://checkout_test:local-test-only@127.0.0.1:55439/checkout_test
      DATABASE_URL: postgresql://checkout_test:local-test-only@127.0.0.1:55439/checkout_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
